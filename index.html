<html lang="en">
<head>

<title>Quote Search Engine - Live Quote Resolver</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='48' y2='48' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Cg transform='translate(9.6,9.6) scale(1.2)'%3E%3Cpath fill='%23060913' d='M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h14l-4.5-6-3.5 4.51-2.5-3.01L5 15z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
 :root {
   --bg: #060913;
   --panel: #0d1322;
   --panel-raised: #151d30;
   --line: #222f47;
   --line-soft: #141c2e;
   --text: #f1f5f9;
   --text-dim: #94a3b8;
   --text-faint: #8393b8;

   --cyan-main: #38bdf8;
   --indigo-accent: #6366f1;
   --teal-accent: #2dd4bf;
   --amber-accent: #fbbf24;
   --red-accent: #f87171;
   --emerald-glow: rgba(45, 212, 191, 0.15);

   --font-mono: 'JetBrains Mono', monospace;
   --font-body: 'Plus Jakarta Sans', sans-serif;
   --img-letterbox: #02040a;
 }

 /* Follows the OS/browser preference rather than a manual toggle - no stored
    preference to manage, no extra control to add to an already-dense header.
    Only the surface/text/line tokens change; the cyan/indigo/teal accent
    colors and the always-dark logo-icon/btn-primary text stay the same in
    both themes, since those sit on their own fixed-color backgrounds. */
 @media (prefers-color-scheme: light) {
   :root {
     --bg: #f4f6fb;
     --panel: #ffffff;
     --panel-raised: #eef1f8;
     --line: #d8deeb;
     --line-soft: #e6eaf3;
     --text: #0f172a;
     --text-dim: #475569;
     --text-faint: #64748b;
     --emerald-glow: rgba(13, 148, 136, 0.12);
     --img-letterbox: #e6eaf3;
   }
 }

 * { box-sizing: border-box; }

 body {
   margin: 0;
   background:
     radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08), transparent 40%),
     radial-gradient(circle at 90% 85%, rgba(99, 102, 241, 0.08), transparent 45%),
     var(--bg);
   color: var(--text);
   font-family: var(--font-body);
   font-size: 14px;
   line-height: 1.6;
   min-height: 100vh;
 }

 .wrap {
   max-width: 900px;
   margin: 0 auto;
   padding: 40px 24px 80px;
 }

 .hdr {
   display: flex;
   justify-content: space-between;
   align-items: center;
   flex-wrap: wrap;
   gap: 10px;
   margin-bottom: 28px;
   padding-bottom: 16px;
   border-bottom: 1px solid var(--line);
 }

 .brand {
   display: flex;
   align-items: center;
   gap: 14px;
 }

 .logo-icon {
   width: 42px;
   height: 42px;
   background: linear-gradient(135deg, var(--cyan-main), var(--indigo-accent));
   border-radius: 10px;
   display: flex;
   align-items: center;
   justify-content: center;
   box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
 }

 .logo-icon svg {
   width: 22px;
   height: 22px;
   fill: #060913;
 }

 .hdr h1 {
   font-family: var(--font-body);
   font-size: clamp(17px, 4.5vw, 22px);
   font-weight: 800;
   margin: 0;
   color: var(--text);
   letter-spacing: -0.02em;
 }

 .tag-pill {
   background: rgba(56, 189, 248, 0.1);
   border: 1px solid rgba(56, 189, 248, 0.25);
   color: var(--cyan-main);
   font-family: var(--font-mono);
   font-size: clamp(9px, 2.4vw, 11px);
   font-weight: 700;
   padding: 4px 10px;
   border-radius: 6px;
   text-transform: uppercase;
   white-space: nowrap;
   flex-shrink: 0;
 }

 .input-card {
   background: var(--panel);
   border: 1px solid var(--line);
   border-radius: 14px;
   padding: 20px;
   box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
 }

 .input-label {
   display: block;
   font-family: var(--font-mono);
   font-size: 10px;
   text-transform: uppercase;
   letter-spacing: 0.08em;
   color: var(--text-faint);
   font-weight: 700;
   margin-bottom: 8px;
 }

 textarea {
   width: 100%;
   min-height: 95px;
   background: var(--panel-raised);
   border: 1px solid var(--line);
   border-radius: 8px;
   color: var(--text);
   font-family: var(--font-body);
   font-size: 14px;
   padding: 14px;
   resize: vertical;
   outline: none;
   transition: border-color 0.2s ease, box-shadow 0.2s ease;
 }

 textarea::placeholder {
   color: var(--text-faint);
 }

 textarea:focus {
   border-color: var(--cyan-main);
   box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
 }

 .char-counter {
   font-family: var(--font-mono);
   font-size: 11px;
   color: var(--text-faint);
   text-align: right;
   margin-top: 6px;
 }

 .char-counter.near-limit {
   color: var(--amber-accent);
 }

 .char-counter.at-limit {
   color: var(--red-accent);
 }

 .action-row {
   display: flex;
   gap: 10px;
   margin-top: 16px;
   align-items: center;
   flex-wrap: wrap;
 }

 button.btn-primary {
   background: linear-gradient(135deg, var(--cyan-main), var(--indigo-accent));
   color: #060913;
   border: none;
   border-radius: 6px;
   font-family: var(--font-body);
   font-weight: 700;
   font-size: 13px;
   padding: 10px 22px;
   cursor: pointer;
   transition: opacity 0.15s ease, transform 0.15s ease;
 }

 button.btn-primary:hover {
   opacity: 0.92;
   transform: translateY(-1px);
 }

 button.btn-primary:disabled {
   opacity: 0.5;
   cursor: not-allowed;
   transform: none;
 }

 button.btn-secondary {
   background: var(--panel-raised);
   color: var(--text-dim);
   border: 1px solid var(--line);
   border-radius: 6px;
   font-family: var(--font-body);
   font-weight: 600;
   font-size: 12px;
   padding: 9px 13px;
   cursor: pointer;
   transition: all 0.15s ease;
 }

 button.btn-secondary:hover {
   color: var(--text);
   border-color: var(--cyan-main);
 }

 .history-section {
   margin-top: 14px;
   padding-top: 14px;
   border-top: 1px solid var(--line-soft);
   display: none;
 }

 .history-header {
   display: flex;
   align-items: center;
   justify-content: space-between;
   margin-bottom: 8px;
 }

 .history-label {
   font-family: var(--font-mono);
   font-size: 10px;
   text-transform: uppercase;
   color: var(--text-faint);
   font-weight: 700;
 }

 button.history-clear-all {
   background: none;
   border: none;
   color: var(--text-faint);
   font-family: var(--font-mono);
   font-size: 10px;
   text-transform: uppercase;
   cursor: pointer;
   padding: 0;
 }

 button.history-clear-all:hover {
   color: var(--red-accent);
   text-decoration: underline;
 }

 .history-row {
   display: flex;
   gap: 8px;
   flex-wrap: wrap;
 }

 .history-chip {
   display: inline-flex;
   align-items: center;
   background: var(--panel-raised);
   border: 1px dashed var(--line);
   border-radius: 6px;
   max-width: 360px;
   transition: all 0.15s ease;
 }

 .history-chip:hover {
   background: rgba(56, 189, 248, 0.1);
   border-color: var(--cyan-main);
 }

 button.btn-history {
   background: none;
   border: none;
   font-family: var(--font-mono);
   font-size: 11px;
   padding: 6px 4px 6px 10px;
   cursor: pointer;
   overflow: hidden;
   white-space: nowrap;
   text-overflow: ellipsis;
   display: inline-flex;
   align-items: center;
   gap: 6px;
   min-width: 0;
 }

 .history-chip:hover .history-detail {
   color: var(--text);
 }

 .history-type {
   color: var(--teal-accent);
   font-weight: 700;
   flex-shrink: 1;
   max-width: 130px;
   overflow: hidden;
   white-space: nowrap;
   text-overflow: ellipsis;
 }

 .history-detail {
   color: var(--text-dim);
   overflow: hidden;
   text-overflow: ellipsis;
   min-width: 0;
 }

 button.history-delete {
   background: none;
   border: none;
   color: var(--text-faint);
   font-size: 14px;
   line-height: 1;
   padding: 6px 8px 6px 4px;
   cursor: pointer;
   flex-shrink: 0;
 }

 button.history-delete:hover {
   color: var(--red-accent);
 }

 .history-time {
   color: var(--text-faint);
   font-size: 10px;
   flex-shrink: 0;
 }

 .example-section {
   margin-top: 14px;
   padding-top: 14px;
   border-top: 1px solid var(--line-soft);
 }

 button.btn-example {
   background: var(--panel-raised);
   border: 1px solid var(--line);
   border-radius: 6px;
   color: var(--text-dim);
   font-family: var(--font-mono);
   font-size: 11px;
   padding: 6px 12px;
   cursor: pointer;
   transition: all 0.15s ease;
 }

 button.btn-example:hover {
   color: var(--text);
   border-color: var(--cyan-main);
   background: rgba(56, 189, 248, 0.08);
 }

 #result {
   margin-top: 32px;
   display: none;
 }

 .status-banner {
   font-family: var(--font-mono);
   font-size: 11px;
   color: var(--teal-accent);
   background: var(--emerald-glow);
   border: 1px solid rgba(45, 212, 191, 0.3);
   padding: 8px 14px;
   border-radius: 6px;
   margin-bottom: 20px;
   display: flex;
   align-items: center;
   gap: 8px;
 }

 .status-banner.status-info {
   color: var(--cyan-main);
   background: rgba(56, 189, 248, 0.08);
   border-color: rgba(56, 189, 248, 0.25);
 }

 .status-banner.status-warn {
   color: var(--amber-accent);
   background: rgba(251, 191, 36, 0.1);
   border-color: rgba(251, 191, 36, 0.3);
 }

 .status-banner.status-error {
   color: var(--red-accent);
   background: rgba(248, 113, 113, 0.1);
   border-color: rgba(248, 113, 113, 0.3);
 }

 .match-hero {
   background: var(--panel);
   border: 1px solid var(--line);
   border-top: 4px solid var(--cyan-main);
   border-radius: 14px;
   padding: 24px;
   margin-bottom: 20px;
   box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
 }

 .work-title-badge {
   font-family: var(--font-mono);
   font-size: 11px;
   text-transform: uppercase;
   color: var(--cyan-main);
   letter-spacing: 0.12em;
   font-weight: 700;
   margin-bottom: 6px;
 }

 .media-title {
   font-size: clamp(22px, 6vw, 30px);
   font-weight: 800;
   margin: 0 0 6px 0;
   color: var(--text);
   letter-spacing: -0.02em;
   text-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
 }

 .media-author {
   font-size: 16px;
   font-weight: 600;
   color: var(--teal-accent);
   margin-bottom: 12px;
 }

 .media-meta {
   color: var(--text-dim);
   font-size: 13px;
   margin-bottom: 20px;
 }

 .media-gallery {
   display: grid;
   grid-template-columns: repeat(auto-fill, minmax(200px, 260px));
   justify-content: start;
   gap: 16px;
   margin-bottom: 20px;
 }

 .asset-card {
   background: var(--panel-raised);
   border: 1px solid var(--line);
   border-radius: 10px;
   overflow: hidden;
   display: flex;
   flex-direction: column;
 }

 .asset-img {
   width: 100%;
   height: 240px;
   object-fit: contain;
   background: var(--img-letterbox);
   display: block;
 }

 .asset-caption {
   padding: 8px 12px;
   font-size: 11px;
   font-weight: 700;
   font-family: var(--font-mono);
   color: var(--text-dim);
   text-transform: uppercase;
   background: rgba(0, 0, 0, 0.3);
   border-top: 1px solid var(--line-soft);
   text-align: center;
 }

 .canonical-box {
   background: var(--panel-raised);
   border-left: 4px solid var(--cyan-main);
   padding: 14px 18px;
   border-radius: 0 8px 8px 0;
 }

 .canonical-box .label {
   font-family: var(--font-mono);
   font-size: 10px;
   text-transform: uppercase;
   color: var(--text-faint);
   font-weight: 700;
   display: block;
   margin-bottom: 4px;
 }

 .canonical-box .quote-text {
   font-size: 15px;
   font-weight: 600;
   color: var(--text);
   font-style: italic;
 }

 .canonical-box.verified-box {
   border-left-color: var(--teal-accent);
   margin-top: 12px;
 }

 .canonical-box.verified-box .label {
   color: var(--teal-accent);
 }

 .canonical-box .label-row {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 10px;
 }

 button.btn-copy-inline {
   background: none;
   border: none;
   color: var(--teal-accent);
   font-family: var(--font-mono);
   font-size: 10px;
   text-transform: uppercase;
   cursor: pointer;
   padding: 0;
   flex-shrink: 0;
 }

 button.btn-copy-inline:hover {
   text-decoration: underline;
 }

 .section-header {
   font-family: var(--font-mono);
   font-size: 12px;
   font-weight: 700;
   text-transform: uppercase;
   letter-spacing: 0.05em;
   color: var(--cyan-main);
   margin: 24px 0 12px;
 }

 .grid-cards {
   display: grid;
   grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
   gap: 12px;
 }

 .info-card {
   background: var(--panel);
   border: 1px solid var(--line);
   border-radius: 10px;
   padding: 16px;
 }

 .info-card .card-title {
   color: var(--text-faint);
   font-family: var(--font-mono);
   font-size: 10px;
   font-weight: 700;
   text-transform: uppercase;
   margin-bottom: 4px;
 }

 .info-card .card-value {
   color: var(--text);
   font-size: 13px;
   font-weight: 600;
 }

 .trivia-list {
   background: var(--panel);
   border: 1px solid var(--line);
   border-radius: 10px;
   overflow: hidden;
 }

 .trivia-item {
   padding: 14px 18px;
   border-bottom: 1px solid var(--line-soft);
   display: flex;
   gap: 12px;
   align-items: flex-start;
 }

 .trivia-item:last-child {
   border-bottom: none;
 }

 .trivia-bullet {
   color: var(--cyan-main);
   font-weight: bold;
   font-size: 12px;
   margin-top: 2px;
   flex-shrink: 0;
 }

 .trivia-text {
   font-size: 13px;
   color: var(--text-dim);
 }

 .footer-text {
   margin-top: 40px;
   text-align: center;
   font-family: var(--font-mono);
   font-size: 11px;
   color: var(--text-faint);
   border-top: 1px solid var(--line-soft);
   padding-top: 20px;
 }

 .candidate-list {
   display: flex;
   flex-direction: column;
   gap: 10px;
 }

 button.btn-candidate {
   display: grid;
   grid-template-columns: auto 1fr auto;
   align-items: center;
   gap: 4px 12px;
   width: 100%;
   background: var(--panel);
   border: 1px solid var(--line);
   border-radius: 10px;
   padding: 12px 16px;
   text-align: left;
   cursor: pointer;
   color: var(--text);
   font-family: var(--font-body);
   transition: all 0.15s ease;
 }

 button.btn-candidate:hover {
   border-color: var(--cyan-main);
   background: rgba(56, 189, 248, 0.06);
 }

 button.btn-candidate:focus-visible {
   outline: 2px solid var(--cyan-main);
   outline-offset: 2px;
 }

 button.btn-candidate:disabled {
   opacity: 0.55;
   cursor: default;
 }

 button.btn-candidate.btn-candidate-selected {
   border-color: var(--teal-accent);
   background: rgba(45, 212, 191, 0.12);
   opacity: 1;
 }

 .candidate-score {
   font-family: var(--font-mono);
   font-size: 11px;
   font-weight: 700;
   color: var(--teal-accent);
   background: var(--emerald-glow);
   border-radius: 5px;
   padding: 3px 7px;
   white-space: nowrap;
 }

 .candidate-title {
   font-weight: 700;
   font-size: 14px;
 }

 .candidate-source {
   font-family: var(--font-mono);
   font-size: 10px;
   text-transform: uppercase;
   color: var(--text-faint);
   white-space: nowrap;
 }

 .candidate-snippet {
   grid-column: 1 / -1;
   font-size: 12px;
   color: var(--text-dim);
   margin-top: 2px;
   display: -webkit-box;
   -webkit-line-clamp: 2;
   -webkit-box-orient: vertical;
   overflow: hidden;
 }

 /* A bare percentage number doesn't communicate "good vs. shaky" at a glance
    the way a colored bar does - tier color mirrors the same thresholds the
    app already uses to decide auto-accept vs. picker vs. low-confidence. */
 .confidence-meter {
   grid-column: 1 / -1;
   width: 100%;
   height: 5px;
   background: var(--line-soft);
   border-radius: 3px;
   overflow: hidden;
   margin-top: 4px;
 }

 .confidence-meter-fill {
   height: 100%;
   border-radius: 3px;
 }

 .confidence-meter-fill.tier-low { background: var(--red-accent); }
 .confidence-meter-fill.tier-mid { background: var(--amber-accent); }
 .confidence-meter-fill.tier-high { background: var(--teal-accent); }

 .info-card .confidence-meter { margin-top: 8px; }

 /* Re-triggered via a classList remove/reflow/add cycle in JS each time a
    result or picker is rendered - a plain class addition wouldn't restart the
    animation on the second and later renders since the class is already present. */
 @keyframes resultReveal {
   from { opacity: 0; transform: translateY(8px); }
   to { opacity: 1; transform: translateY(0); }
 }

 #result.reveal {
   animation: resultReveal 0.35s ease;
 }

 @keyframes shimmer {
   0% { background-position: -400px 0; }
   100% { background-position: 400px 0; }
 }

 .skeleton {
   background: linear-gradient(90deg, var(--panel-raised) 25%, var(--line) 37%, var(--panel-raised) 63%);
   background-size: 800px 100%;
   animation: shimmer 1.4s linear infinite;
   border-radius: 6px;
 }

 .skeleton-hero {
   background: var(--panel);
   border: 1px solid var(--line);
   border-top: 4px solid var(--line);
   border-radius: 14px;
   padding: 24px;
   margin-bottom: 20px;
 }

 .skeleton-line {
   height: 13px;
   margin-bottom: 12px;
 }

 .skeleton-line.w-30 { width: 30%; height: 11px; }
 .skeleton-line.w-55 { width: 55%; height: 28px; }
 .skeleton-line.w-70 { width: 70%; height: 16px; }
 .skeleton-line.w-100 { width: 100%; }

 .skeleton-grid {
   display: grid;
   grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
   gap: 12px;
   margin-top: 20px;
 }

 .skeleton-card {
   height: 58px;
   border-radius: 10px;
 }
</style>
</head>
<body>

<div class="wrap">

 <div class="hdr">
   <div class="brand">
     <div class="logo-icon">
       <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h14l-4.5-6-3.5 4.51-2.5-3.01L5 15z"/></svg>
     </div>
     <h1>Quote Search Engine</h1>
   </div>
   <span class="tag-pill">Live Search</span>
 </div>

 <div class="input-card">
   <label for="input" class="input-label">Quote / Excerpt</label>
   <textarea id="input" maxlength="1000" placeholder="Enter any dialogue quote, literary excerpt, lyric, or speech snippet..." oninput="updateCharCounter()" onkeydown="handleInputKeydown(event)"></textarea>
   <div id="charCounter" class="char-counter">0 / 1000</div>
   <div class="action-row">
     <button id="identifyBtn" class="btn-primary" onclick="analyze()">Identify Quote</button>
     <button class="btn-secondary" onclick="clearAll()">Reset</button>
   </div>
   <div id="historySection" class="history-section">
     <div class="history-header">
       <div class="history-label">Recent Resolved Works (Last 8)</div>
       <button id="clearHistoryBtn" class="history-clear-all" type="button">Clear all</button>
     </div>
     <div id="historyRow" class="history-row"></div>
   </div>
   <div id="exampleSection" class="example-section">
     <div class="history-label">Try an Example</div>
     <div id="exampleRow" class="history-row"></div>
   </div>
 </div>

 <div id="result" role="region" aria-label="Resolution results" aria-live="polite"></div>

 <div class="footer-text">
   Live queries via Wikiquote, Wikipedia REST &amp; iTunes Search APIs - no static lookup table
